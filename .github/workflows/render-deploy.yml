name: Deploy Status

# O deploy em si é feito pelo Render a cada push na main. Este workflow só
# registra o ambiente no GitHub, depois de conferir que a API responde.
on:
  push:
    branches: [main]

jobs:
  deployment:
    runs-on: ubuntu-latest
    permissions:
      deployments: write
      contents: read
    env:
      # Endereço do backend no Render. Se o serviço mudar de endereço, crie a
      # variável URL_API em Settings > Secrets and variables > Actions > Variables
      # (ela vale mais que o padrão abaixo), sem precisar mexer neste arquivo.
      URL_API: ${{ vars.URL_API || 'https://autos-fj4y.onrender.com' }}
    steps:
      # O Render leva alguns minutos pro deploy, e no plano gratuito o serviço
      # pode estar dormindo (o primeiro acesso demora até ~1 min).
      # 20 tentativas de até 20 s, com 10 s entre elas: no máximo ~10 minutos.
      - name: Conferir se a API está no ar
        id: health
        run: |
          echo "Conferindo $URL_API/health"
          for tentativa in $(seq 1 20); do
            if curl -fsS --max-time 20 "$URL_API/health" | grep -q '"ok"'; then
              echo "API respondeu na tentativa $tentativa."
              echo "estado=success" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Tentativa $tentativa sem resposta, esperando 10 s..."
            sleep 10
          done
          echo "::error::A API não respondeu em $URL_API/health. Confira se o endereço do Render mudou (variável URL_API)."
          echo "estado=failure" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Registrar o ambiente no GitHub
        if: always()
        uses: actions/github-script@v7
        env:
          ESTADO: ${{ steps.health.outputs.estado || 'failure' }}
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'Production (Render)',
              auto_merge: false,
              required_contexts: []
            });

            const ok = process.env.ESTADO === 'success';
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: ok ? 'success' : 'failure',
              environment_url: process.env.URL_API,
              description: ok
                ? 'Backend em produção no Render (health ok)'
                : 'A API não respondeu ao /health'
            });
