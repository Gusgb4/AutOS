name: Deploy Status

on:
  push:
    branches: [ main ]

jobs:
  deployment:
    runs-on: ubuntu-latest
    permissions:
      deployments: write
      contents: read
    steps:
      - name: Registrar e Ativar Ambiente no GitHub
        uses: actions/github-script@v7
        with:
          script: |
            // 1. Cria a solicitação de deploy
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'Production (Render)',
              auto_merge: false,
              required_contexts: []
            });

            // 2. Atualiza o status para Sucesso (verde) e adiciona o link da API
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment_url: 'https://autos-t60j.onrender.com',
              description: 'Backend em produção no Render'
            });
